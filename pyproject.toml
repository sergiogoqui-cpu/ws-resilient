[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ws-resilient"
version = "0.1.0"
description = "WebSocket client that reconnects with exponential backoff and jitter, detects dead connections and lost messages."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Sergio Gómez" }]
keywords = ["websocket", "reconnect", "backoff", "asyncio", "trading", "market-data"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: AsyncIO",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
]
dependencies = ["websockets>=12"]

[project.urls]
Homepage = "https://github.com/sergiogoqui-cpu/ws-resilient"
Issues = "https://github.com/sergiogoqui-cpu/ws-resilient/issues"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/ws_resilient"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
strict = true
files = ["src"]
